name: Refresh lockfile

# Run by hand from the Actions tab to regenerate package-lock.json
# from package.json, e.g. after changing dependencies. The new file is
# uploaded as an artifact and pushed to the `bot/package-lock` branch,
# ready to review and copy into main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only --no-audit --no-fund

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json

      - name: Push to the bot/package-lock branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c bot/package-lock
          git add package-lock.json
          git commit -m "Regenerate package-lock.json"
          git push --force origin bot/package-lock
